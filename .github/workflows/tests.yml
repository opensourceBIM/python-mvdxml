# This file was generated with the assistance of an AI coding tool.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: python -m pip install "ifcopenshell[advanced]" pytest pyparsing

      - name: Install the checked-out MVD modules
        shell: bash
        run: |
          package_dir="$(python -c 'import ifcopenshell, pathlib; print(pathlib.Path(ifcopenshell.__file__).parent / "mvd")')"
          cp ./*.py "$package_dir/"

      - name: Run tests
        working-directory: tests
        run: python -m pytest .
